version: 2.1

jobs:
  recorder-build:
    docker:
      - image: cimg/node:22.12
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - recorder-npm-{{ checksum "recorder/package-lock.json" }}
      - run:
          name: Install
          command: cd recorder && npm ci
      - save_cache:
          key: recorder-npm-{{ checksum "recorder/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Typecheck and build
          command: cd recorder && npm run build
      - run:
          name: Committed references.json matches bench/
          command: git diff --exit-code recorder/public/references.json

  intake-app:
    docker:
      - image: ghcr.io/cirruslabs/flutter:3.47.5
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - intake-app-pub-{{ checksum "intake/app/pubspec.lock" }}
      - run:
          name: Install
          command: cd intake/app && flutter pub get
      - save_cache:
          key: intake-app-pub-{{ checksum "intake/app/pubspec.lock" }}
          paths:
            - ~/.pub-cache
      - run:
          name: Generated files are committed and current
          command: |
            cd intake/app
            dart run build_runner build -d
            find lib -name '*.g.dart' -o -name '*.freezed.dart' | xargs dart format
            git diff --exit-code -- lib
            test -z "$(git ls-files --others --exclude-standard -- lib)"
      - run:
          name: Format
          command: cd intake/app && dart format --output=none --set-exit-if-changed lib test
      - run:
          name: Analyze
          command: cd intake/app && flutter analyze
      - run:
          name: Boundaries (prints nothing when clean)
          command: |
            out=$(intake/app/tool/check_boundaries.sh)
            if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - run:
          name: Test
          command: cd intake/app && flutter test

workflows:
  recorder:
    jobs:
      - recorder-build
  intake:
    jobs:
      - intake-app
