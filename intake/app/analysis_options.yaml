include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
  errors:
    unused_result: error
    # freezed + json_serializable put @JsonSerializable on the factory (freezed docs).
    invalid_annotation_target: ignore

linter:
  rules:
    always_use_package_imports: true
    prefer_const_constructors: true
    prefer_final_locals: true
    unawaited_futures: true

formatter:
  page_width: 120
