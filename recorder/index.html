<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bench recorder</title>
    <style>
      :root { color-scheme: light dark; --accent: #2563eb; --ok: #16a34a; --rec: #dc2626; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 17px/1.45 system-ui, -apple-system, sans-serif; }
      main { max-width: 640px; margin: 0 auto; padding: 16px; }
      .notice { font-size: 14px; opacity: 0.75; margin: 0 0 16px; }
      .bonus { background: rgba(234, 179, 8, 0.18); padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; }
      .num { font-size: 15px; font-weight: 600; opacity: 0.7; }
      .text { font-size: 26px; line-height: 1.35; margin: 6px 0 18px; }
      .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      button { font: inherit; font-size: 18px; padding: 14px 20px; border-radius: 10px; border: 1px solid #8884; background: #8881; color: inherit; }
      button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      button.rec { background: var(--rec); color: #fff; border-color: var(--rec); }
      button:disabled { opacity: 0.5; }
      audio { width: 100%; margin-top: 14px; }
      .status { min-height: 1.5em; margin-top: 10px; font-size: 15px; }
      .err { color: var(--rec); }
      .speakers { display: grid; gap: 10px; margin-top: 12px; }
      .speakers a { display: block; padding: 16px; border-radius: 10px; border: 1px solid #8884; text-decoration: none; color: inherit; font-size: 18px; }
      h2 { font-size: 17px; margin: 28px 0 8px; }
      ol { list-style: none; padding: 0; margin: 0; }
      li button { width: 100%; text-align: left; font-size: 15px; padding: 8px 10px; border: none; background: none; border-radius: 6px; display: flex; gap: 8px; }
      li button.current { background: #8882; font-weight: 600; }
      li .mark { width: 1.2em; color: var(--ok); flex: none; }
      li .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
  </head>
  <body>
    <main>
      <p class="notice">Your recordings are used only to score speech-recognition tools. They won't be published.</p>
      <div id="app">Loading…</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
